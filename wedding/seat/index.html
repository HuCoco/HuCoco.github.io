<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f0f7ec">
<title>宾客座位指引</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🪑</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #5e8c4a;
  --green-light: #edf5e8;
  --green-dark: #3d6b2e;
  --bamboo: #7a9e5e;
  --text: #2c3a2c;
  --text-sub: #5f7a5f;
  --bg: #f2f8ef;
  --card: #ffffff;
  --border: #ddebd5;
  --radius: 16px;
  --shadow: 0 2px 16px rgba(94,140,74,0.08);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
  padding-right: var(--sar);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
}

/* === Header === */
.header {
  text-align: center;
  padding: 48px 24px 32px;
  background: linear-gradient(160deg, #fff 0%, var(--green-light) 100%);
}
.header .icon {
  font-size: 52px;
  margin-bottom: 12px;
  animation: float 3s ease-in-out infinite;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header .icon span {
  position: absolute;
  opacity: 0;
  transform: scale(0.5) translateY(10px);
  animation: iconSwitch 12s ease-in-out infinite;
}
.header .icon span:nth-child(1) { animation-delay: 0s; }
.header .icon span:nth-child(2) { animation-delay: 3s; }
.header .icon span:nth-child(3) { animation-delay: 6s; }
.header .icon span:nth-child(4) { animation-delay: 9s; }
@keyframes iconSwitch {
  0% { opacity: 0; transform: scale(0.5) translateY(10px); }
  5% { opacity: 1; transform: scale(1) translateY(0); }
  20% { opacity: 1; transform: scale(1) translateY(-4px); }
  25% { opacity: 0; transform: scale(0.5) translateY(-10px); }
  100% { opacity: 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.header .pre {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--green);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.header h1 {
  font-size: 26px;
  font-weight: 300;
  margin-bottom: 6px;
}
.header .sub {
  font-size: 13px;
  color: var(--text-sub);
}

/* === Container === */
.container {
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  padding: 0 12px 32px;
}

/* === Divider === */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0 20px;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--bamboo), transparent);
}
.divider span {
  font-size: 10px;
  color: var(--green);
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* === Select Tabs (removed, moved to sidebar) === */

/* === Sidebar Panel === */
.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.35);
  z-index: 1000;
}
.sidebar-overlay.visible { display: block; }
.sidebar {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 280px;
  max-width: 80vw;
  background: var(--card);
  z-index: 1001;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);
}
.sidebar-overlay.visible .sidebar { transform: translateX(0); }
.sidebar-close {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.sidebar-close .sidebar-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.sidebar-close button {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--bg);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sidebar-section {
  margin-bottom: 20px;
}
.sidebar-section-title {
  font-size: 12px;
  color: var(--text-sub);
  font-weight: 600;
  margin-bottom: 8px;
  padding-left: 2px;
}
.sidebar-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-item {
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  -webkit-user-select: none;
  user-select: none;
}
.sidebar-item:active { transform: scale(0.97); }
.sidebar-item.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}
.sidebar-item .item-tables {
  font-size: 10px;
  font-weight: 400;
  opacity: 0.7;
}

/* === Open Sidebar Button === */
.open-sidebar-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  border-radius: 12px;
  border: none;
  background: var(--green);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.open-sidebar-btn:active { transform: scale(0.97); opacity: 0.85; }

/* === Sub Categories (removed, moved to sidebar) === */

/* === Result Banner === */
.result-banner {
  background: linear-gradient(135deg, var(--green-light), #d8eace);
  border: 2px solid var(--green);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
  text-align: center;
  opacity: 0;
  transform: translateY(-10px) scale(0.95);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}
.result-banner.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.result-banner .banner-icon {
  font-size: 24px;
  margin-bottom: 6px;
  animation: float 2s ease-in-out infinite;
}
.result-banner .banner-text {
  font-size: 16px;
  font-weight: 700;
  color: var(--green-dark);
}
.result-banner .banner-sub {
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 4px;
}

/* === Hall Card === */
.hall-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.hall-header {
  padding: 14px 18px;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.hall-body {
  padding: 16px 10px;
  position: relative;
}

/* === Stage === (removed) */

/* === Room Outline === */
.room-outline {
  position: relative;
  padding: 16px 8px;
  border: 2.5px solid var(--bamboo);
  border-radius: 12px;
  margin-bottom: 0;
}
/* 底部三道门（用间断边框模拟） */
.room-doors {
  display: flex;
  justify-content: space-around;
  margin-top: 16px;
  padding: 0 10%;
}
.room-door {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 10px;
  color: var(--text-sub);
}
.room-door::before,
.room-door::after {
  content: '';
  width: 12px;
  height: 1.5px;
  background: var(--bamboo);
}

/* === Tables Grid === */
.tables-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px 2px;
  padding: 0;
}

/* === Single Table === */
.table-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: opacity 0.3s, transform 0.3s;
}
.table-item.dimmed {
  opacity: 0.25;
  transform: scale(0.9);
}
.table-item.highlighted {
  transform: scale(1.1);
}

.round-table-svg {
  width: 100%;
  height: auto;
  transition: all 0.3s;
}
.table-item.highlighted .round-table-svg {
  filter: drop-shadow(0 4px 12px rgba(94,140,74,0.3));
}

.table-number {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-top: 6px;
}
.table-item.highlighted .table-number {
  color: var(--green-dark);
}
.table-label {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 2px;
}

/* === Side Labels === */
.side-labels {
  display: flex;
  justify-content: space-around;
  padding: 0 8px;
  margin-bottom: 16px;
}
.side-label {
  font-size: 11px;
  color: var(--text-sub);
  letter-spacing: 1px;
  padding: 4px 12px;
  border-radius: 20px;
  background: var(--green-light);
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.side-label.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
  font-weight: 600;
}

/* === Direction Arrow === */
.direction-arrow {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  margin-top: 20px;
  background: var(--green-light);
  border: 1px dashed var(--bamboo);
  border-radius: 10px;
  font-size: 13px;
  color: var(--green-dark);
  font-weight: 500;
}
.direction-arrow.visible {
  display: flex;
  animation: slideUp 0.4s ease;
}
.direction-arrow .arrow-icon {
  font-size: 20px;
  animation: bounce-arrow 1.5s ease-in-out infinite;
}
@keyframes bounce-arrow {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(8px); }
}
.direction-arrow.left .arrow-icon {
  animation: bounce-arrow-left 1.5s ease-in-out infinite;
}
@keyframes bounce-arrow-left {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-8px); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === Reset Button === */
.btn-reset {
  display: none;
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--card);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-user-select: none;
  user-select: none;
}
.btn-reset:active { transform: scale(0.97); background: var(--green-light); }
.btn-reset.visible { display: block; animation: slideUp 0.4s ease; }

/* === Footer === */
.footer {
  text-align: center;
  padding: 24px 16px calc(24px + var(--sab));
  font-size: 11px;
  color: var(--text-sub);
}
.footer .hearts { color: #e25555; font-size: 14px; margin-bottom: 4px; }

/* === Responsive === */
@media (max-width: 375px) {
  .header { padding: 36px 20px 24px; }
  .header h1 { font-size: 22px; }
  .tables-grid { gap: 4px 1px; }
}

@media (min-width: 768px) {
  .tables-grid { gap: 10px 6px; }
}

/* === Dark Mode === */
@media (prefers-color-scheme: dark) {
  :root {
    --text: #e0e8dc;
    --text-sub: #9ab08e;
    --bg: #0f1a0f;
    --card: #1a261a;
    --border: #2a3d28;
    --green: #7fa862;
    --green-light: #1a261a;
    --green-dark: #a0c88a;
    --bamboo: #5a7e4a;
  }
  .header { background: linear-gradient(160deg, #1a261a 0%, #1f2e1c 100%); }
  .result-banner { background: linear-gradient(135deg, #1f2e1c, #253520); border-color: var(--green); }
  .result-banner .banner-text { color: var(--green); }
  .side-label { background: #1f2e1c; }
  .side-label.active { background: var(--green); color: #fff; }
  .room-outline { border-color: var(--bamboo); }
  .sidebar { background: #1a261a; }
  .sidebar-close button { background: #0f1a0f; }
  .sidebar-item { background: #0f1a0f; border-color: #2a3d28; }
  .sidebar-item.active { background: var(--green); border-color: var(--green); }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="icon" style="position:relative;">
    <span>💒</span>
    <span>🪑</span>
    <span>🍽</span>
    <span>🎊</span>
  </div>
  <div class="pre">Seating Guide</div>
  <h1>宾客座位指引</h1>
  <div class="sub">选择宾客类别，快速找到您的桌位</div>
</div>

<div class="container">

  <!-- Hall Card (视觉重心，置顶) -->
  <div class="hall-card" id="hall-card" style="margin-top:20px;">
    <div class="hall-header">
      <span>🍽</span>
      <span>宴会厅桌位分布</span>
    </div>
    <div class="hall-body">
      <!-- Side Labels -->
      <div class="side-labels">
        <span class="side-label" id="label-left">← 左侧</span>
        <span class="side-label" id="label-right">右侧 →</span>
      </div>

      <!-- Room Outline -->
      <div class="room-outline">
        <!-- Tables -->
        <div class="tables-grid" id="tables-grid"></div>

        <!-- Doors at bottom -->
        <div class="room-doors">
          <span class="room-door">门</span>
          <span class="room-door">门</span>
          <span class="room-door">门</span>
        </div>
      </div>

      <!-- Direction Arrow -->
      <div class="direction-arrow" id="direction-arrow">
        <span class="arrow-icon" id="arrow-icon">👈</span>
        <span id="arrow-text">您的桌位在左侧</span>
      </div>
    </div>
  </div>

  <div class="divider"><span>查找您的桌位</span></div>

  <!-- Open Sidebar Button -->
  <button class="open-sidebar-btn" onclick="openSidebar()">🪑 点击查找我的桌位</button>

  <!-- Result Banner -->
  <div class="result-banner" id="result-banner">
    <div class="banner-icon" id="banner-icon">👰</div>
    <div class="banner-text" id="banner-text"></div>
    <div class="banner-sub" id="banner-sub"></div>
  </div>

  <!-- Reset Button -->
  <button class="btn-reset" id="btn-reset" onclick="resetSelection()">🔄 重新选择</button>
</div>

<!-- Footer -->
<div class="footer">
  <div class="hearts">♥ ♥ ♥</div>
  <p>祝您用餐愉快，感谢莅临！</p>
</div>

<!-- Sidebar Panel -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()">
  <div class="sidebar" onclick="event.stopPropagation()">
    <div class="sidebar-close">
      <span class="sidebar-title">查找我的桌位</span>
      <button onclick="closeSidebar()">✕</button>
    </div>
    <div id="sidebarContent"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // === 分类配置 ===
  var CATEGORIES = {
    bride: {
      name: '任任',
      icon: '👰',
      groups: [
        { name: '任任大学好友', tables: [1, 2] },
        { name: '任任初中好友', tables: [3] },
        { name: '任任高中好友\n弟弟妹妹', tables: [4] },
        { name: '任任领导\n同事', tables: [5] },
        { name: '任任成都家人', tables: [6] },
        { name: '任任垫江家人', tables: [7, 8, 9, 10, 11] }
      ]
    },
    groom: {
      name: '小胡',
      icon: '🤵',
      groups: [
        { name: '小胡好友', tables: [12] },
        { name: '小胡胡家家人', tables: [13, 14, 15, 16, 17] },
        { name: '小胡邹家家人', tables: [18, 19, 20, 21, 22] },
        { name: '小胡马家寺家人', tables: [23, 24, 25, 26, 27] },
        { name: '小胡爸爸同学', tables: [28] },
        { name: '小胡爸爸朋友', tables: [29, 30, 31, 32] },
        { name: '小胡爸爸同事', tables: [33, 34, 35] }
      ]
    }
  };

  var totalTables = 35;
  var currentSide = null;
  var currentGroup = null;

  // === 生成圆桌 SVG ===
  function createTableSVG(tableNum, isHighlighted) {
    var seats = 10;
    var cx = 55, cy = 55, tableR = 22, seatR = 7, orbitR = 40;
    var seatCircles = '';

    for (var i = 0; i < seats; i++) {
      var angle = (2 * Math.PI / seats) * i - Math.PI / 2;
      var sx = cx + orbitR * Math.cos(angle);
      var sy = cy + orbitR * Math.sin(angle);
      var seatFill = isHighlighted ? '#5e8c4a' : '#c8d8c0';
      var seatOpacity = isHighlighted ? '0.85' : '0.5';
      seatCircles += '<circle cx="' + sx.toFixed(1) + '" cy="' + sy.toFixed(1) + '" r="' + seatR + '" fill="' + seatFill + '" opacity="' + seatOpacity + '" stroke="#fff" stroke-width="1.5"/>';
    }

    var tableFill = isHighlighted ? '#edf5e8' : '#f5f5f2';
    var tableStroke = isHighlighted ? '#5e8c4a' : '#d0d0c8';
    var tableStrokeW = isHighlighted ? '2.5' : '1.5';
    var textFill = isHighlighted ? '#2c3a2c' : '#555';

    return '<svg class="round-table-svg" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">' +
      seatCircles +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + tableR + '" fill="' + tableFill + '" stroke="' + tableStroke + '" stroke-width="' + tableStrokeW + '"/>' +
      '<text x="' + cx + '" y="' + (cy + 7) + '" text-anchor="middle" fill="' + textFill + '" font-size="20" font-weight="800">' + tableNum + '</text>' +
      '</svg>';
  }

  // === 渲染桌位 ===
  var tablesCached = false;

  function renderTables(highlightTables) {
    var grid = document.getElementById('tables-grid');

    if (!tablesCached) {
      // 首次渲染：创建所有桌位 DOM
      grid.innerHTML = '';
      var leftCount = Math.ceil(totalTables / 2);
      var rightCount = totalTables - leftCount;
      var colsPerSide = 4;

      var leftRows = [];
      for (var i = 0; i < leftCount; i += colsPerSide) {
        var row = [];
        for (var c = 0; c < colsPerSide; c++) {
          var idx = i + c;
          row.push(idx < leftCount ? idx + 1 : null);
        }
        leftRows.push(row);
      }

      var rightRows = [];
      for (var j = 0; j < rightCount; j += colsPerSide) {
        var row2 = [];
        for (var c2 = 0; c2 < colsPerSide; c2++) {
          var idx2 = j + c2;
          row2.push(idx2 < rightCount ? leftCount + idx2 + 1 : null);
        }
        rightRows.push(row2);
      }

      var maxRows = Math.max(leftRows.length, rightRows.length);
      for (var row3 = 0; row3 < maxRows; row3++) {
        var leftCols = leftRows[row3] || [null, null, null, null];
        var rightCols = rightRows[row3] || [null, null, null, null];
        var fullRow = leftCols.concat(rightCols);
        fullRow.forEach(function(tNum) {
          appendTableCell(grid, tNum, null);
        });
      }
      tablesCached = true;
    }

    // 更新高亮状态（不重建DOM）
    var items = grid.querySelectorAll('.table-item[data-table]');
    items.forEach(function(el) {
      var num = parseInt(el.dataset.table);
      el.classList.remove('highlighted', 'dimmed');
      if (highlightTables !== null) {
        if (highlightTables.indexOf(num) !== -1) {
          el.classList.add('highlighted');
          // 更新SVG为高亮样式
          el.innerHTML = createTableSVG(num, true);
        } else {
          el.classList.add('dimmed');
          el.innerHTML = createTableSVG(num, false);
        }
      } else {
        el.innerHTML = createTableSVG(num, false);
      }
    });
  }

  function appendTableCell(grid, tNum, highlightTables) {
    var div = document.createElement('div');
    if (tNum !== null) {
      var isH = (highlightTables !== null && highlightTables.indexOf(tNum) !== -1);
      div.className = 'table-item';
      div.dataset.table = tNum;
      div.innerHTML = createTableSVG(tNum, isH);
    } else {
      div.className = 'table-item';
      div.style.visibility = 'hidden';
    }
    grid.appendChild(div);
  }

  // === 获取桌号对应的分类名（简短版） ===
  function getGroupName(tableNum) {
    for (var side in CATEGORIES) {
      var groups = CATEGORIES[side].groups;
      for (var i = 0; i < groups.length; i++) {
        if (groups[i].tables.indexOf(tableNum) !== -1) {
          var name = groups[i].name;
          var prefix = CATEGORIES[side].name;
          var shortName = name.indexOf(prefix) === 0 ? name.substring(prefix.length) : name;
          return shortName.replace(/\n/g, '/');
        }
      }
    }
    return '';
  }

  // === 初始化：页面加载时渲染全部桌位 ===
  renderTables(null);

  // === 打开侧边栏 ===
  window.openSidebar = function() {
    var content = document.getElementById('sidebarContent');
    var html = '';

    for (var side in CATEGORIES) {
      var cat = CATEGORIES[side];
      html += '<div class="sidebar-section">';
      html += '<div class="sidebar-section-title">' + cat.icon + ' ' + cat.name + '宾客</div>';
      html += '<div class="sidebar-items">';
      cat.groups.forEach(function(g) {
        var tableText = g.tables.length === 1 ? '第' + g.tables[0] + '桌' : '第' + g.tables[0] + '-' + g.tables[g.tables.length-1] + '桌';
        var displayName = g.name.replace(cat.name, '').replace(/\n/g, ' · ');
        html += '<div class="sidebar-item" onclick="selectTable(\'' + side + '\',' + JSON.stringify(g.tables) + ')">' +
          '<span>' + displayName + '</span>' +
          '<span class="item-tables">' + tableText + '</span>' +
          '</div>';
      });
      html += '</div></div>';
    }

    content.innerHTML = html;
    document.getElementById('sidebarOverlay').classList.add('visible');
  };

  // === 关闭侧边栏 ===
  window.closeSidebar = function() {
    document.getElementById('sidebarOverlay').classList.remove('visible');
  };

  // === 选择桌位 ===
  window.selectTable = function(side, tables) {
    var cat = CATEGORIES[side];
    var group = cat.groups.find(function(g) { return JSON.stringify(g.tables) === JSON.stringify(tables); });

    // 高亮侧边栏项
    var items = document.querySelectorAll('.sidebar-item');
    items.forEach(function(el) { el.classList.remove('active'); });
    event.target.closest('.sidebar-item').classList.add('active');

    // 高亮桌位
    renderTables(tables);

    // 更新横幅
    var banner = document.getElementById('result-banner');
    document.getElementById('banner-icon').textContent = cat.icon;
    var tableText = tables.length === 1 ? '第 ' + tables[0] + ' 桌' : '第 ' + tables[0] + '~' + tables[tables.length-1] + ' 桌';
    document.getElementById('banner-text').textContent = group.name.replace(/\n/g, ' · ') + ' · ' + tableText;
    var leftCount = Math.ceil(totalTables / 2);
    var isLeft = tables[tables.length - 1] <= leftCount;
    document.getElementById('banner-sub').textContent = isLeft ? '请前往左侧桌位就座' : '请前往右侧桌位就座';
    banner.classList.add('visible');

    // 更新侧标签
    document.getElementById('label-left').classList.toggle('active', isLeft);
    document.getElementById('label-right').classList.toggle('active', !isLeft);

    // 方向箭头
    var dirArrow = document.getElementById('direction-arrow');
    var arrowIcon = document.getElementById('arrow-icon');
    var arrowText = document.getElementById('arrow-text');
    if (isLeft) {
      arrowIcon.textContent = '👈';
      arrowText.textContent = '您的桌位在左侧（' + tableText + '）';
      dirArrow.classList.add('left');
    } else {
      arrowIcon.textContent = '👉';
      arrowText.textContent = '您的桌位在右侧（' + tableText + '）';
      dirArrow.classList.remove('left');
    }
    dirArrow.classList.add('visible');

    // 显示重置按钮
    document.getElementById('btn-reset').classList.add('visible');

    // 关闭侧边栏
    closeSidebar();
  };

  // === 重置 ===
  window.resetSelection = function() {
    currentSide = null;
    currentGroup = null;
    document.getElementById('result-banner').classList.remove('visible');
    document.getElementById('direction-arrow').classList.remove('visible');
    document.getElementById('btn-reset').classList.remove('visible');
    document.getElementById('label-left').classList.remove('active');
    document.getElementById('label-right').classList.remove('active');
    renderTables(null);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

})();
</script>
</body>
</html>
