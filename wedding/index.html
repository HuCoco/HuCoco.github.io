<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f0f7ec">
<title>婚礼宾客指南</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>💍</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #5e8c4a;
  --green-light: #edf5e8;
  --green-dark: #3d6b2e;
  --bamboo: #7a9e5e;
  --text: #2c3a2c;
  --text-sub: #5f7a5f;
  --bg: #f2f8ef;
  --card: #ffffff;
  --border: #ddebd5;
  --radius: 16px;
  --shadow: 0 2px 16px rgba(94,140,74,0.08);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
  padding-right: var(--sar);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
  display: flex;
  flex-direction: column;
}

/* === Header === */
.header {
  text-align: center;
  padding: 52px 24px 36px;
  width: 100%;
  background: linear-gradient(160deg, #fff 0%, var(--green-light) 100%);
  flex-shrink: 0;
}
.header .icon {
  font-size: 56px;
  margin-bottom: 14px;
  animation: float 3s ease-in-out infinite;
  position: relative;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header .icon span {
  position: absolute;
  opacity: 0;
  transform: scale(0.5) translateY(10px);
  animation: iconSwitch 12s ease-in-out infinite;
}
.header .icon span:nth-child(1) { animation-delay: 0s; }
.header .icon span:nth-child(2) { animation-delay: 3s; }
.header .icon span:nth-child(3) { animation-delay: 6s; }
.header .icon span:nth-child(4) { animation-delay: 9s; }
@keyframes iconSwitch {
  0% { opacity: 0; transform: scale(0.5) translateY(10px); }
  5% { opacity: 1; transform: scale(1) translateY(0); }
  20% { opacity: 1; transform: scale(1) translateY(-4px); }
  25% { opacity: 0; transform: scale(0.5) translateY(-10px); }
  100% { opacity: 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.header .pre {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--green);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.header h1 {
  font-size: 26px;
  font-weight: 300;
  margin-bottom: 8px;
  color: var(--text);
}
.header .sub {
  font-size: 13px;
  color: var(--text-sub);
}

/* === Container === */
.container {
  max-width: 640px;
  width: 100%;
  margin: 0 auto;
  padding: 0 16px 32px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* === Divider === */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 24px;
  width: 100%;
}
.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--bamboo), transparent);
}
.divider span {
  font-size: 10px;
  color: var(--green);
  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* === Nav Cards === */
.nav-cards {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}
.nav-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  display: flex;
  align-items: stretch;
  transition: all 0.2s ease;
  border: 2px solid transparent;
  -webkit-user-select: none;
  user-select: none;
  min-height: 100px;
}
.nav-card:active {
  transform: scale(0.97);
  border-color: var(--green);
}

.nav-card .card-icon {
  width: 88px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  background: linear-gradient(135deg, var(--green-light) 0%, #d8eace 100%);
  flex-shrink: 0;
}
.nav-card .card-body {
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  min-width: 0;
}
.nav-card .card-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 6px;
}
.nav-card .card-desc {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.6;
}
.nav-card .card-arrow {
  display: flex;
  align-items: center;
  padding: 0 14px;
  color: var(--green);
  font-size: 22px;
  font-weight: 300;
  flex-shrink: 0;
}

/* === Footer === */
.footer {
  text-align: center;
  padding: 20px 16px calc(20px + var(--sab));
  font-size: 11px;
  color: var(--text-sub);
  width: 100%;
  flex-shrink: 0;
}
.footer .hearts {
  color: #e25555;
  font-size: 14px;
  margin-bottom: 4px;
}

/* === Small Screen (iPhone SE etc) === */
@media (max-width: 375px) {
  .header { padding: 40px 20px 28px; }
  .header .icon { font-size: 44px; }
  .header h1 { font-size: 22px; }
  .header .sub { font-size: 12px; }
  .nav-card .card-icon { width: 72px; font-size: 30px; }
  .nav-card .card-title { font-size: 15px; }
  .nav-card .card-desc { font-size: 11px; }
}

/* === Tall phones — add extra spacing === */
@media (min-height: 750px) {
  .container { padding-top: 8px; }
}

/* === Dark Mode === */
@media (prefers-color-scheme: dark) {
  :root {
    --text: #e0e8dc;
    --text-sub: #9ab08e;
    --bg: #0f1a0f;
    --card: #1a261a;
    --border: #2a3d28;
    --green: #7fa862;
    --green-light: #1a261a;
    --bamboo: #5a7e4a;
  }
  .header { background: linear-gradient(160deg, #1a261a 0%, #1f2e1c 100%); }
  .nav-card .card-icon { background: linear-gradient(135deg, #1f2e1c 0%, #253520 100%); }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="icon">
    <span>🐼</span>
    <span>💍</span>
    <span>🎋</span>
    <span>🍲</span>
  </div>
  <div class="pre">Wedding Guest Guide</div>
  <h1>婚礼宾客指南</h1>
  <div class="sub">欢迎来到成都，感谢您参加我们的婚礼</div>
</div>

<div class="container">
  <div class="divider"><span>请选择</span></div>

  <div class="nav-cards">
    <!-- 美食地图 -->
    <a class="nav-card" href="./food/">
      <div class="card-icon">🍜</div>
      <div class="card-body">
        <div class="card-title">成都美食地图</div>
        <div class="card-desc">为远道而来的朋友们精心准备的美食推荐，涵盖火锅、串串、川菜等地道美味</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <!-- 宾客导航 -->
    <a class="nav-card" href="./hotel/">
      <div class="card-icon">💒</div>
      <div class="card-body">
        <div class="card-title">宾客导航</div>
        <div class="card-desc">婚礼酒店与住宿酒店位置指引，支持实时定位与一键导航</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <!-- 宾客座位指引 -->
    <a class="nav-card" href="./seat/">
      <div class="card-icon">🪑</div>
      <div class="card-body">
        <div class="card-title">宾客座位指引</div>
        <div class="card-desc">快速查找您的座位安排，轻松入座</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <div class="hearts">♥ ♥ ♥</div>
  <p>期待与您相聚，我们婚礼见！</p>
</div>

</body>
</html>
