* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --gold: #5e8c4a;
  --gold-light: #edf5e8;
  --gold-dark: #3d6b2e;
  --text: #2c3a2c;
  --text-sub: #5f7a5f;
  --bg: #f2f8ef;
  --card: #ffffff;
  --border: #ddebd5;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(94,140,74,0.06);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
html { -webkit-text-size-adjust:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding-top: var(--sat);
  padding-bottom: var(--sab);
  padding-left: var(--sal);
  padding-right: var(--sar);
  -webkit-overflow-scrolling: touch;
}

/* === Header === */
.header {
  text-align: center;
  padding: 36px 20px 24px;
  background: linear-gradient(160deg, #fff 0%, var(--gold-light) 100%);
}
.header .pre {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.header h1 {
  font-size: 24px;
  font-weight: 300;
  margin-bottom: 4px;
  color: var(--text);
}
.header .sub {
  font-size: 12px;
  color: var(--text-sub);
}

/* === Container === */
.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 12px 32px;
}

/* === Filter === */
.filter-section {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin: 20px 0 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.filter-title {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 10px;
  font-weight: 500;
}
.tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.tag-btn {
  padding: 5px 12px;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-sub);
  font-weight: 500;
  -webkit-user-select: none;
  user-select: none;
}
.tag-btn:active { transform: scale(0.95); }
.tag-btn.active {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}
.tag-btn.active-all {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}

/* === Results === */
.results-count {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 10px;
  padding-left: 4px;
}

/* === Food Grid === */
.food-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

/* === Food Card === */
.food-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: all 0.2s;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.food-card:active { transform: scale(0.98); }
.food-card.expanded {
  border: 2px solid var(--gold);
  box-shadow: 0 2px 12px rgba(201,169,110,0.15);
}
.food-card .card-images {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 0;
}
.food-card .card-images img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}
.food-card .card-images.single img {
  height: 180px;
}
.food-card .card-images.double img {
  height: 140px;
}
.food-card .card-content {
  padding: 14px 16px;
}
.food-card .name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.food-card .spicy {
  font-size: 12px;
}
.food-card .desc {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.6;
  margin-bottom: 8px;
}
.food-card .card-info-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.food-card .card-price {
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-dark);
}
.food-card .card-address {
  font-size: 11px;
  color: var(--text-sub);
}
.food-card .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.food-card .meta-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--gold-light);
  color: var(--gold-dark);
  font-weight: 500;
}
.food-card .recommend {
  font-size: 12px;
  color: var(--gold-dark);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}
.food-card .recommend::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
}
.food-card .link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  padding: 6px 12px;
  background: #ff6633;
  color: #fff;
  border-radius: 14px;
  font-size: 11px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s;
}
.food-card .link-btn:active { transform: scale(0.95); opacity: 0.8; }
.food-card .link-btn svg {
  width: 11px;
  height: 11px;
  fill: currentColor;
}

/* === Branch Tabs === */
.food-card .branch-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.food-card .branch-tab {
  padding: 4px 10px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: transparent;
  font-size: 11px;
  cursor: pointer;
  color: var(--text-sub);
  font-weight: 500;
  transition: all 0.2s;
  -webkit-user-select: none;
  user-select: none;
}
.food-card .branch-tab:active { transform: scale(0.95); }
.food-card .branch-tab.active {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}
.food-card .branch-info {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 4px;
}
.food-card .branch-price {
  font-size: 12px;
  font-weight: 600;
  color: var(--gold-dark);
}

/* === Navigation Panel === */
.food-card .nav-panel {
  display: none;
  border-top: 1px solid var(--border);
}
.food-card.expanded .nav-panel {
  display: block;
}
.food-card .nav-panel .map-container {
  width: 100%;
  height: 200px;
}
.food-card .nav-go-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px;
  background: var(--gold);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s;
}
.food-card .nav-go-overlay:active { opacity: 0.8; }
.food-card .nav-go-overlay svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}

/* === Expand Hint === */
.food-card .expand-hint {
  font-size: 10px;
  color: #bbb;
  text-align: center;
  padding: 6px 02px;
}
.food-card.expanded .expand-hint { display: none; }

/* === No Results === */
.no-results {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-sub);
}
.no-results .emoji {
  font-size: 36px;
  margin-bottom: 10px;
}

/* === Tips === */
.tips-section {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin-top: 20px;
}
.tips-section h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
}
.tips-section ul {
  list-style: none;
  padding: 0;
}
.tips-section li {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.8;
  padding-left: 14px;
  position: relative;
}
.tips-section li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
}

/* === Footer === */
.footer {
  text-align: center;
  padding: 20px 16px;
  font-size: 11px;
  color: var(--text-sub);
}
.footer .hearts {
  color: #e25555;
  font-size: 13px;
  margin-bottom: 4px;
}

/* === Responsive === */
@media (max-width: 375px) {
  .header h1 { font-size: 20px; }
  .food-card .card-images.single img { height: 140px; }
}
/* === Dark Mode === */
@media (prefers-color-scheme: dark) {
  :root {
    --text: #e0e8dc;
    --text-sub: #9ab08e;
    --bg: #0f1a0f;
    --card: #1a261a;
    --border: #2a3d28;
    --gold: #7fa862;
    --gold-light: #1a261a;
    --gold-dark: #5a7e4a;
  }
  .header { background: linear-gradient(160deg, #1a261a 0%, #1f2e1c 100%); }
}
</style>

// Tag categories
const spicyTags = ["不辣", "微微辣", "微辣", "中辣", "特辣"];
const categoryTags = ["火锅", "串串", "川菜", "小吃", "烧烤", "汤锅", "酒"];

let activeTags = new Set();

function renderTags() {
  const spicyRow = document.getElementById("spicyRow");
  const categoryRow = document.getElementById("categoryRow");

  let spicyHtml = '';
  spicyTags.forEach(tag => {
    spicyHtml += '<button class="tag-btn' + (activeTags.has(tag) ? ' active' : '') + '" onclick="toggleTag(\'' + tag + '\')">' + tag + '</button>';
  });
  spicyRow.innerHTML = spicyHtml;

  let categoryHtml = '';
  categoryTags.forEach(tag => {
    categoryHtml += '<button class="tag-btn' + (activeTags.has(tag) ? ' active' : '') + '" onclick="toggleTag(\'' + tag + '\')">' + tag + '</button>';
  });
  categoryRow.innerHTML = categoryHtml;
}

function toggleTag(tag) {
  if (activeTags.has(tag)) activeTags.delete(tag);
  else activeTags.add(tag);
  renderTags();
  renderFoods();
}

function clearFilter() {
  activeTags.clear();
  renderTags();
  renderFoods();
}

function getSpicyLevel(n) {
  if (n === 0) return "";
  return "\u{1F336}\u{FE0F}".repeat(n);
}

function renderFoods() {
  const grid = document.getElementById("foodGrid");
  const noResults = document.getElementById("noResults");
  const countEl = document.getElementById("resultsCount");

  let filtered = foods;
  if (activeTags.size > 0) {
    var activeSpicy = [...activeTags].filter(t => spicyTags.includes(t));
    var activeCategory = [...activeTags].filter(t => categoryTags.includes(t));
    filtered = foods.filter(f => {
      // 辣度匹配：检查食物的辣度标签（可能是斜杠组合）是否包含选中的辣度
      var matchSpicy = activeSpicy.length === 0 || activeSpicy.some(t => f.tags.some(ft => ft.split('/').includes(t)));
      var matchCategory = activeCategory.length === 0 || activeCategory.some(t => f.tags.includes(t));
      return matchSpicy && matchCategory;
    });
  }

  countEl.textContent = "\u5171 " + filtered.length + " \u9879\u7F8E\u98DF";

  if (filtered.length === 0) {
    grid.innerHTML = "";
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  let html = "";
  filtered.forEach(function(f, idx) {
    const spicy = getSpicyLevel(f.spicy);
    const hasBranches = f.branches && f.branches.length > 0;
    const defaultBranch = hasBranches ? f.branches[0] : null;
    const linkUrl = hasBranches ? defaultBranch.link : f.link;
    const linkHtml = linkUrl ? '<a class="link-btn" href="' + linkUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zm-2 16H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7H12z"/></svg>\u5927\u4F17\u70B9\u8BC4</a>' : "";
    const priceHtml = f.price ? '<span class="card-price">' + f.price + '</span>' : "";
    const addressHtml = (!hasBranches && f.address) ? '<div class="card-address">' + f.address + '</div>' : "";

    let imagesHtml = "";
    if (f.images && f.images.length > 0) {
      const cls = f.images.length === 1 ? "single" : f.images.length === 2 ? "double" : "";
      imagesHtml = '<div class="card-images ' + cls + '">' + f.images.map(function(url) { return '<img src="' + url + '" alt="' + f.name + '" loading="lazy">'; }).join("") + '</div>';
    }

    // 分店标签
    let branchHtml = "";
    if (hasBranches) {
      branchHtml = '<div class="branch-tabs">';
      f.branches.forEach(function(b, bi) {
        branchHtml += '<button class="branch-tab' + (bi === 0 ? ' active' : '') + '" onclick="switchBranch(event,' + idx + ',' + bi + ')">' + b.name + '</button>';
      });
      branchHtml += '</div>';
      branchHtml += '<div class="branch-info" id="branch-addr-' + idx + '">' + defaultBranch.address + '</div>';
    }

    // 导航面板
    let navHtml = "";
    if (hasBranches) {
      const b = defaultBranch;
      const dname = encodeURIComponent(f.name + ' ' + b.name);
      const navUrl = 'https://apis.map.qq.com/uri/v1/marker?marker=coord:' + b.lat + ',' + b.lng + ';title:' + dname + '&referer=chengdu_food_map';
      navHtml = '<div class="nav-panel"><div class="map-container" id="map-' + idx + '" data-lat="' + b.lat + '" data-lng="' + b.lng + '" data-name="' + f.name + '"></div><a class="nav-go-overlay" id="nav-link-' + idx + '" href="' + navUrl + '" target="_blank" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>\u70B9\u51FB\u5BFC\u822A\u5230\u8FD9\u91CC</a></div>';
    } else if (f.lat && f.lng) {
      const dname = encodeURIComponent(f.name);
      const navUrl = 'https://apis.map.qq.com/uri/v1/marker?marker=coord:' + f.lat + ',' + f.lng + ';title:' + dname + '&referer=chengdu_food_map';
      navHtml = '<div class="nav-panel"><div class="map-container" id="map-' + idx + '" data-lat="' + f.lat + '" data-lng="' + f.lng + '" data-name="' + f.name + '"></div><a class="nav-go-overlay" id="nav-link-' + idx + '" href="' + navUrl + '" target="_blank" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>\u70B9\u51FB\u5BFC\u822A\u5230\u8FD9\u91CC</a></div>';
    }

    const hasNav = hasBranches || (f.lat && f.lng);
    const hintHtml = hasNav ? '<div class="expand-hint">\u70B9\u51FB\u5361\u7247\u5C55\u5F00\u5BFC\u822A</div>' : "";

    html += '<div class="food-card" data-idx="' + idx + '" onclick="toggleCard(this)">' +
      imagesHtml +
      '<div class="card-content">' +
        '<div class="name">' + f.name + ' <span class="spicy">' + spicy + '</span></div>' +
        '<div class="desc">' + f.desc + '</div>' +
        branchHtml +
        '<div class="card-info-row">' + priceHtml + addressHtml + '</div>' +
        '<div class="meta">' + f.tags.map(function(t) { return '<span class="meta-tag">' + t + '</span>'; }).join("") + '</div>' +
        (f.recommend ? '<div class="recommend">' + f.recommend + '</div>' : "") +
        linkHtml +
        hintHtml +
      '</div>' +
      navHtml +
    '</div>';
  });
  grid.innerHTML = html;
}

renderTags();
renderFoods();

function toggleCard(el) {
  var wasExpanded = el.classList.contains("expanded");
  el.classList.toggle("expanded");

  if (!wasExpanded) {
    var mapEl = el.querySelector(".map-container");
    if (mapEl && !mapEl.dataset.inited) {
      mapEl.dataset.inited = "1";
      var lat = parseFloat(mapEl.dataset.lat);
      var lng = parseFloat(mapEl.dataset.lng);
      setTimeout(function() {
        var center = new TMap.LatLng(lat, lng);
        var map = new TMap.Map(mapEl, {
          center: center,
          zoom: 16,
          draggable: true,
          scrollable: true,
          doubleClickZoom: true,
        });
        var marker = new TMap.MultiMarker({
          map: map,
          geometries: [{ id: "shop", position: center }]
        });
        mapEl._mapInstance = map;
        mapEl._markerInstance = marker;
        mapEl.addEventListener("click", function(e) { e.stopPropagation(); });
        mapEl.addEventListener("touchstart", function(e) { e.stopPropagation(); }, { passive: true });
      }, 150);
    }
  }
}

// 切换分店
function switchBranch(event, foodIdx, branchIdx) {
  event.stopPropagation();
  var f = foods[foodIdx];
  if (!f.branches) return;
  var b = f.branches[branchIdx];

  // 更新分店标签高亮
  var card = event.target.closest(".food-card");
  var tabs = card.querySelectorAll(".branch-tab");
  tabs.forEach(function(t, i) {
    t.classList.toggle("active", i === branchIdx);
  });

  // 更新地址
  var addrEl = document.getElementById("branch-addr-" + foodIdx);
  if (addrEl) addrEl.textContent = b.address;

  // 更新导航链接
  var navLink = document.getElementById("nav-link-" + foodIdx);
  if (navLink) {
    var dname = encodeURIComponent(f.name + " " + b.name);
    navLink.href = "https://apis.map.qq.com/uri/v1/marker?marker=coord:" + b.lat + "," + b.lng + ";title:" + dname + "&referer=chengdu_food_map";
  }

  // 更新地图位置
  var mapEl = document.getElementById("map-" + foodIdx);
  if (mapEl && mapEl._mapInstance) {
    var newCenter = new TMap.LatLng(b.lat, b.lng);
    mapEl._mapInstance.setCenter(newCenter);
    mapEl._markerInstance.setGeometries([{ id: "shop", position: newCenter }]);
  } else if (mapEl) {
    // 地图还没初始化，更新 data 属性
    mapEl.dataset.lat = b.lat;
    mapEl.dataset.lng = b.lng;
    mapEl.dataset.inited = "";
  }
}
